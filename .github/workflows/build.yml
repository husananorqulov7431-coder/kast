name: Build KinoCast (APK & EXE)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FilmCaster.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmCaster-Android-APK
          path: FilmCaster.apk

  build-windows:
    name: 💻 Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows Single-File EXE (Self-Contained)
        run: |
          dotnet publish windows/KinoReceiver/KinoReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o bin/publish/

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: FilmReceiver-Windows-EXE
          path: bin/publish/FilmReceiver.exe

  create-release:
    name: 🚀 Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: FilmCaster-Android-APK
          path: release_files/

      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: FilmReceiver-Windows-EXE
          path: release_files/

      - name: Generate Release Tag
        id: tag
        run: |
          echo "tag_name=v1.0.0-$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Publish Release with APK & EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "🎬 KinoCast v1.0.0 - Tayyor APK va EXE"
          body: |
            ### 🎬 KinoCast (16:9 Cinema Streamer)
            Ushbu relizda quyidagi tayyor fayllar mavjud:
            - **`FilmCaster.apk`**: Android telefoningizga o'rnatiladigan ilova.
            - **`FilmReceiver.exe`**: Windows kompyuteringizda ishga tushadigan portable pleer.
            
            #### Qanday ishlatiladi?
            1. Telefonda Hotspot (Tochka) yoqing va kompyuterni unga ulang.
            2. Telefonda **FilmCaster** ilovasini ochib **Uzatishni Boshlash** ni bosing.
            3. Kompyuterda **FilmReceiver.exe** ni ishga tushiring.
            4. Telefonda kinoni gorizontal (16:9) qilib qo'ying — kino darhol kompyuterda ko'rinadi!
          files: |
            release_files/FilmCaster.apk
            release_files/FilmReceiver.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
