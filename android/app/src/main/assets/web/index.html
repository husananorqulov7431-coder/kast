<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 KinoCast v3.0 - Cinema Streamer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; }
        #container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        
        #player {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background: #000;
        }

        /* Overlay: Telefon tikka turganda */
        #standbyOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10;
            transition: opacity 0.3s ease;
        }
        .icon { font-size: 64px; margin-bottom: 16px; }
        h1 { font-size: 28px; color: #FFB300; margin-bottom: 10px; font-weight: 700; }
        p { font-size: 16px; color: #AAA; max-width: 480px; line-height: 1.6; }
        .status-badge {
            margin-top: 24px; display: inline-flex; align-items: center; gap: 8px;
            background: #1C2826; border: 1px solid #00E676; padding: 8px 18px;
            border-radius: 20px; font-size: 13px; color: #00E676; font-weight: 600;
        }
        .dot { width: 10px; height: 10px; background: #00E676; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Controls */
        #controls { position: absolute; bottom: 20px; right: 20px; z-index: 20; display: flex; gap: 12px; opacity: 0; transition: opacity 0.3s; }
        #container:hover #controls { opacity: 1; }
        .btn {
            background: rgba(30, 30, 30, 0.85); border: 1px solid #444; color: white;
            padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500;
        }
        .btn:hover { background: rgba(50, 50, 50, 0.95); }
    </style>
    <script src="jmuxer.min.js"></script>
</head>
<body>
    <div id="container">
        <!-- Standby Overlay -->
        <div id="standbyOverlay">
            <div class="icon">📱 ➔ 🔄 ➔ 🎬</div>
            <h1>Kino Rejimi Kutilmoqda (16:9)</h1>
            <p>Aloqa o'rnatildi! Kinoni to'liq ekranda ko'rish uchun telefoningizni <b>gorizontal (yotqizilgan)</b> holatga buring.</p>
            <div class="status-badge">
                <span class="dot"></span> <span id="statusText">Telefon bilan aloqa faol</span>
            </div>
        </div>

        <video id="player" autoplay playsinline muted></video>

        <div id="controls">
            <button class="btn" id="btnUnmute">🔊 Ovozni Yoqish</button>
            <button class="btn" id="btnFullscreen">⛶ To'liq Ekran (F11)</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('player');
        const standbyOverlay = document.getElementById('standbyOverlay');
        const statusText = document.getElementById('statusText');
        const btnUnmute = document.getElementById('btnUnmute');
        const btnFullscreen = document.getElementById('btnFullscreen');

        // JMuxer MP4 remuxerini ishga tushirish (H.264 + AAC)
        const jmuxer = new JMuxer({
            node: 'player',
            mode: 'both',
            flushingTime: 0,
            clearBuffer: true,
            fps: 30,
            debug: false
        });

        // Foydalanuvchi bir marta bosganda ovozni ochish (Brauzer siyosati talabi)
        document.body.addEventListener('click', () => {
            if (video.muted) {
                video.muted = false;
                btnUnmute.innerText = "🔊 Ovoz Faol";
                btnUnmute.style.borderColor = "#00e676";
            }
        }, { once: true });

        btnUnmute.addEventListener('click', (e) => {
            e.stopPropagation();
            video.muted = false;
            btnUnmute.innerText = "🔊 Ovoz Faol";
            btnUnmute.style.borderColor = "#00e676";
        });

        btnFullscreen.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        // WebSocket orqali oqimni qabul qilish
        function connect() {
            const host = window.location.hostname || "172.30.121.120";
            const wsUrl = "ws://" + host + ":8081/";
            console.log("WebSocket ulanmoqda: " + wsUrl);

            const ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                console.log("Ulandi!");
                statusText.innerText = "Telefon bilan aloqa faol";
            };

            ws.onmessage = (event) => {
                const data = new Uint8Array(event.data);
                if (data.length === 0) return;

                const packetType = data[0];
                const payload = data.subarray(1);

                if (packetType === 0x01) {
                    // H.264 Video NAL
                    jmuxer.feed({ video: payload });
                } else if (packetType === 0x02) {
                    // AAC Audio
                    jmuxer.feed({ audio: payload });
                } else if (packetType === 0x03) {
                    // Holat (Gorizontal / Tikka)
                    try {
                        const status = JSON.parse(new TextDecoder().decode(payload));
                        if (status.isLandscape) {
                            standbyOverlay.style.display = 'none';
                        } else {
                            standbyOverlay.style.display = 'flex';
                        }
                    } catch (e) {}
                }
            };

            ws.onclose = () => {
                statusText.innerText = "Qayta ulanmoqda...";
                setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error("WS Xatolik:", err);
            };
        }

        connect();
    </script>
</body>
</html>
