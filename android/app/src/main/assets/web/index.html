<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 KinoCast - 16:9 Cinema Receiver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: #fff; }
        #container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
        #videoCanvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; object-fit: contain; background: #000; }

        /* Standby Overlay */
        #standbyOverlay, #pinOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 20px; z-index: 10;
        }
        #pinOverlay { z-index: 20; background: #121212; }
        .pin-input {
            font-size: 32px; letter-spacing: 12px; text-align: center; width: 220px;
            padding: 10px; margin: 20px 0; background: #222; border: 2px solid #00E676;
            color: #00E676; border-radius: 12px; outline: none; font-weight: bold;
        }
        .btn-pin {
            background: #1E88E5; color: white; border: none; padding: 12px 30px;
            font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        .btn-pin:hover { background: #1565C0; }
        .icon-box { font-size: 56px; margin-bottom: 16px; }
        h2 { font-size: 26px; color: #ffb300; margin-bottom: 8px; }
        p { font-size: 15px; color: #aaa; max-width: 480px; line-height: 1.5; }
        .badge { margin-top: 20px; background: #1e1e1e; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-size: 12px; color: #00e676; }
        #controls { position: absolute; bottom: 20px; right: 20px; z-index: 30; display: flex; gap: 10px; opacity: 0; transition: opacity 0.3s; }
        #container:hover #controls { opacity: 1; }
        .btn { background: rgba(30, 30, 30, 0.85); border: 1px solid #444; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>
    <div id="container">
        <!-- PIN Kiritish Qatlami -->
        <div id="pinOverlay">
            <div class="icon-box">🔑</div>
            <h2>PIN Kodni Kiriting</h2>
            <p>Telefoningiz ekranida ko'rsatilgan 4 xonali PIN kodni kiriting:</p>
            <input type="text" id="pinField" class="pin-input" maxlength="6" placeholder="----" autocomplete="off" />
            <button class="btn-pin" id="btnSubmitPin">Ulanish</button>
            <div id="pinError" style="color: #ff5252; margin-top: 10px; font-size: 14px;"></div>
        </div>

        <!-- Standby Overlay (Telefon vertikal turganda) -->
        <div id="standbyOverlay" style="display: none;">
            <div class="icon-box">🎬</div>
            <h2>Kino Rejimi Kutilmoqda (16:9)</h2>
            <p>Telefoningizni <b>gorizontal</b> holatga buring va kinoni to'liq ekranga qo'ying.</p>
            <div class="badge">🔒 Xavfsiz: Bildirishnoma va xabarlar kompyuterga o'tmaydi</div>
        </div>

        <canvas id="videoCanvas" width="1920" height="1080"></canvas>

        <div id="controls">
            <button class="btn" id="btnAudio">🔊 Ovozni Yoqish</button>
            <button class="btn" id="btnFullscreen">⛶ To'liq Ekran (16:9)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const pinOverlay = document.getElementById('pinOverlay');
        const pinField = document.getElementById('pinField');
        const btnSubmitPin = document.getElementById('btnSubmitPin');
        const pinError = document.getElementById('pinError');
        const standbyOverlay = document.getElementById('standbyOverlay');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnAudio = document.getElementById('btnAudio');

        let ws = null;
        let videoDecoder = null;
        let audioContext = null;
        let isAudioUnlocked = false;

        // URL parametrlaridan PIN ni tekshirish
        const urlParams = new URLSearchParams(window.location.search);
        let activePin = urlParams.get('pin') || '';

        if (activePin) {
            pinOverlay.style.display = 'none';
            initPlayer(activePin);
        } else {
            pinField.focus();
        }

        btnSubmitPin.addEventListener('click', () => {
            const pin = pinField.value.trim();
            if (pin.length >= 4) {
                pinError.innerText = "Ulanmoqda...";
                fetch('/auth?pin=' + encodeURIComponent(pin)).then(r => r.json()).then(data => {
                    if (data.auth) {
                        pinOverlay.style.display = 'none';
                        initPlayer(pin);
                    } else {
                        pinError.innerText = "Noto'g'ri PIN kod!";
                    }
                }).catch(() => {
                    // Agar HTTP auth bo'lmasa to'g'ridan to'g'ri WS orqali urinib ko'rish
                    pinOverlay.style.display = 'none';
                    initPlayer(pin);
                });
            } else {
                pinError.innerText = "Kamida 4 ta raqam kiriting!";
            }
        });

        pinField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') btnSubmitPin.click();
        });

        function initPlayer(pin) {
            initVideoDecoder();
            connectWs(pin);
        }

        function connectWs(pin) {
            const host = window.location.hostname || "192.168.43.1";
            const wsUrl = "ws://" + host + ":8081/?pin=" + encodeURIComponent(pin);

            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                console.log("WebSocket ulandi!");
            };

            ws.onmessage = async (event) => {
                if (typeof event.data === "string") {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.auth === false) {
                            pinOverlay.style.display = 'flex';
                            pinError.innerText = "Noto'g'ri PIN kod kiritildi!";
                        }
                    } catch(e) {}
                    return;
                }

                const data = new Uint8Array(event.data);
                if (data.length === 0) return;

                const packetType = data[0];
                const payload = data.subarray(1);

                if (packetType === 0x01) {
                    handleVideoPacket(payload);
                } else if (packetType === 0x02) {
                    handleAudioPacket(payload);
                } else if (packetType === 0x03) {
                    try {
                        const status = JSON.parse(new TextDecoder().decode(payload));
                        if (status.isLandscape) {
                            standbyOverlay.style.display = 'none';
                        } else {
                            standbyOverlay.style.display = 'flex';
                        }
                    } catch (e) {}
                }
            };

            ws.onclose = () => {
                setTimeout(() => connectWs(pin), 2500);
            };
        }

        function initVideoDecoder() {
            if (!('VideoDecoder' in window)) return;
            videoDecoder = new VideoDecoder({
                output: (frame) => {
                    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                    frame.close();
                },
                error: (e) => console.error("Video decoder error:", e)
            });
            videoDecoder.configure({
                codec: 'avc1.640028',
                optimizeForLatency: true
            });
        }

        function handleVideoPacket(payload) {
            if (!videoDecoder || videoDecoder.state !== 'configured') return;
            const isKey = (payload[4] & 0x1F) === 5 || (payload[4] & 0x1F) === 7;
            const chunk = new EncodedVideoChunk({
                type: isKey ? 'key' : 'delta',
                timestamp: performance.now() * 1000,
                data: payload
            });
            videoDecoder.decode(chunk);
        }

        function handleAudioPacket(payload) {
            if (!isAudioUnlocked || !audioContext) return;
            audioContext.decodeAudioData(payload.buffer.slice(payload.byteOffset)).then(buffer => {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
            }).catch(() => {});
        }

        btnAudio.addEventListener('click', () => {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
            isAudioUnlocked = true;
            btnAudio.innerText = "🔊 Ovoz Faol";
            btnAudio.style.borderColor = "#00e676";
        });

        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });
    </script>
</body>
</html>
