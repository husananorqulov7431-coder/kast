<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 KinoCast - 16:9 Cinema Receiver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #videoCanvas {
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            background: #000;
        }
        /* Standby Overlay (Telefon vertikal bo'lganda) */
        #standbyOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .icon-box {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffb300;
        }
        p {
            font-size: 16px;
            color: #aaa;
            max-width: 500px;
            line-height: 1.6;
        }
        .badge {
            margin-top: 24px;
            display: inline-block;
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #00e676;
        }
        /* Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 20;
            display: flex;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #container:hover #controls {
            opacity: 1;
        }
        .btn {
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #444;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Standby Overlay: Telefon vertikal turganda shaxsiy ekran ko'rinmaydi -->
        <div id="standbyOverlay">
            <div class="icon-box">📱 ➔ 🔄 ➔ 🎬</div>
            <h2>Kino Rejimi Kutilmoqda (16:9)</h2>
            <p>Iltimos, telefoningizni <b>gorizontal</b> (landscape) holatga buring va kinoni to'liq ekranga qo'ying.</p>
            <div class="badge">🔒 Xavfsiz: Bildirishnomalar va shaxsiy xabarlar kompyuterga o'tmaydi</div>
        </div>

        <canvas id="videoCanvas" width="1920" height="1080"></canvas>

        <div id="controls">
            <button class="btn" id="btnAudio">🔊 Ovozni Yoqish</button>
            <button class="btn" id="btnFullscreen">⛶ To'liq Ekran (16:9)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const standbyOverlay = document.getElementById('standbyOverlay');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnAudio = document.getElementById('btnAudio');

        let ws = null;
        let videoDecoder = null;
        let audioContext = null;
        let isAudioUnlocked = false;

        // WebSocket ulanishini yaratish
        function connect() {
            const host = window.location.hostname || "192.168.43.1";
            const wsUrl = "ws://" + host + ":8081";
            console.log("Ulanmoqda: " + wsUrl);

            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";

            ws.onopen = () => {
                console.log("KinoCast serveriga muvaffaqiyatli ulandi!");
            };

            ws.onmessage = async (event) => {
                const data = new Uint8Array(event.data);
                if (data.length === 0) return;

                const packetType = data[0];
                const payload = data.subarray(1);

                if (packetType === 0x01) {
                    // Video H.264
                    handleVideoPacket(payload);
                } else if (packetType === 0x02) {
                    // Audio AAC
                    handleAudioPacket(payload);
                } else if (packetType === 0x03) {
                    // Holat (Landscape / Portrait)
                    try {
                        const status = JSON.parse(new TextDecoder().decode(payload));
                        if (status.isLandscape) {
                            standbyOverlay.style.opacity = '0';
                            setTimeout(() => { standbyOverlay.style.display = 'none'; }, 300);
                        } else {
                            standbyOverlay.style.display = 'flex';
                            setTimeout(() => { standbyOverlay.style.opacity = '1'; }, 10);
                        }
                    } catch (e) {}
                }
            };

            ws.onclose = () => {
                console.log("Aloqa uzildi, 2 soniyadan keyin qayta ulanadi...");
                setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error("WS Xatolik:", err);
            };
        }

        // WebCodecs orqali past kechikishli apparatli video dekodlash
        function initVideoDecoder() {
            if (!('VideoDecoder' in window)) {
                console.warn("WebCodecs qo'llab-quvvatlanmadi");
                return;
            }

            videoDecoder = new VideoDecoder({
                output: (frame) => {
                    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                    frame.close();
                },
                error: (e) => console.error("Dekoder xatosi:", e)
            });

            videoDecoder.configure({
                codec: 'avc1.640028', // H.264 High Profile
                optimizeForLatency: true
            });
        }

        function handleVideoPacket(payload) {
            if (!videoDecoder || videoDecoder.state !== 'configured') return;

            // NAL kadr turini aniqlash (Key frame yoki Delta frame)
            const isKey = (payload[4] & 0x1F) === 5 || (payload[4] & 0x1F) === 7;

            const chunk = new EncodedVideoChunk({
                type: isKey ? 'key' : 'delta',
                timestamp: performance.now() * 1000,
                data: payload
            });

            videoDecoder.decode(chunk);
        }

        function handleAudioPacket(payload) {
            if (!isAudioUnlocked || !audioContext) return;
            // AAC paketini ijro etish
            audioContext.decodeAudioData(payload.buffer.slice(payload.byteOffset)).then(buffer => {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.start(0);
            }).catch(e => {});
        }

        // Brauzer siyosati bo'yicha foydalanuvchi bosganda audio ruxsat berish
        btnAudio.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            isAudioUnlocked = true;
            btnAudio.innerText = "🔊 Ovoz Faol";
            btnAudio.style.borderColor = "#00e676";
        });

        // To'liq ekran rejimi (16:9 cinema)
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        });

        // Ishga tushirish
        initVideoDecoder();
        connect();
    </script>
</body>
</html>
